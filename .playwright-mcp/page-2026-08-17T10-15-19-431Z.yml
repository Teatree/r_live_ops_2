      - generic [ref=f1e62]:
        - paragraph [ref=f1e63]: "Follow it through. Coins fell -13.8% per player and the saga lane took most of the cut (-65.8%). Unlimited lives rose sharply, mostly from the same saga nodes. Because 94% of all coin spend is the extra-moves continue, and an unlimited-lives window makes failing free, demand for coins fell along with supply: coins spent per attempt -12.8%, lives bought with coins -31.6%."
        - paragraph [ref=f1e64]: Meanwhile the two loops that bring players back daily were tightened at the same time. The daily gift lost 63% of its first six rungs while keeping its day-7 prize, and Night Sky got bigger rewards with unchanged requirements — so the streak loop became more valuable to finish and no easier to hold. Streaks fell -4.0% overall and -9.9% at 100+.
      - generic [ref=f1e65]:
        - paragraph [ref=f1e66]: "The four problems, one sentence each:"
        - list [ref=f1e67]:
          - listitem [ref=f1e68]: New users. Their biggest coin source was the daily gift (29% of their faucet, -37.1%) and their second was saga (-68.0%). Completes -2.6%, D1 churn +1.1%.
          - listitem [ref=f1e69]: Streaks. Night Sky is the streak engine and its rewards moved without its gates; the deepest round is claimed on 3.3% of player-days at 10-19.
          - listitem [ref=f1e70]: Coin spend. One action is 94.5% of the whole sink, and v2 removed the pressure behind it.
          - listitem [ref=f1e71]: Top-segment revenue. 100+ lost -18.4% of coins, gained +41.5% of free lives, and bought -27.3% fewer coin packs. Revenue -31.0%.
    - paragraph [ref=f1e72]: "Baseline note: your NS proposal is already in NS_v2 and is treated here as the baseline: it adds +6.56 coins/pd at 20-39 and +6.58 at 100+. Everything priced below is on top of that. The season pass, level difficulty and all IAP/offer configuration are out of scope by your instruction; where they matter they are named rather than proposed (P7, P12)."
