        - generic [ref=f1e152]:
          - generic [ref=f1e153]: published
          - generic [ref=f1e154]: "Daily-reward calendars are the most consistently reported retention feature in casual mobile: benchmark reports across 2023–2025 put a functioning day-1 to day-7 loop among the highest-effect-size retention levers at the top of the funnel, where our own D1 churn sits at 53% for new users."
        - generic [ref=f1e155]:
          - generic [ref=f1e156]: observed design
          - generic [ref=f1e157]: "Candy Crush Saga, Royal Match and Gardenscapes all escalate the first week rather than back-loading it: something lands on day 1, and each day visibly beats the last. Our v2 ladder pays 10 coins on days 1, 4 and 6 and nothing on 2, 3 and 5 — a new player's first three days can return 10 coins total, which is one tenth of a single continue."
