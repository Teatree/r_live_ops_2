    - heading "Boosters — how the sim did on the item economy" [level=3] [ref=e2621]
    - paragraph [ref=e2622]: "Player-day-weighted, free amounts. \"on-scored act / pred\" compares like-for-like: the live change on exactly the cells the sim could score, against the sim's prediction there. Booster faucets are drips next to HC, but the pattern is consistent: where a config exists, the sim tracks booster direction (Jigsaw UL-Chuck ×0.90 vs ×1.04; the saga item ratios; Daily Gift contents identical per claim in both arms — the live nerf was HC-only, which the sim also got right). The two real gaps are both about which source pays, not the totals: the saga UL-Lives swap (21.8 min/pd live through saga, sim ×1.0 — nothing else is the same order of magnitude) and Rainbow Maker's item ladder, which the sim over-pays on every booster it touches (UL Lives 23.7 sim vs 7.8 live; Slingshot 0.99 vs 0.40). Net effect on the UL total: 23.6 predicted vs 36.1 live — the two errors are in the same resource and partly cancel."
