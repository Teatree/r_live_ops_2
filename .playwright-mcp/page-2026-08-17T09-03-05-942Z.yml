  - generic [ref=e1121]:
    - generic [ref=e1122]: "01"
    - heading "Overview — what diverged, and how this comparison was built" [level=2] [ref=e1123]
    - generic [ref=e1124]:
      - generic [ref=e1125]:
        - generic [ref=e1126]: HC faucet, per active player-day
        - generic [ref=e1127]: 136.6 → 115.9
        - generic [ref=e1128]: live Δ -20.7 (-15%) · whole-faucet sim Δ -17.7 (-13%) — direction and size called, by cancelling errors (§00)
      - generic [ref=e1129]:
        - generic [ref=e1130]: SPT faucet (incl. core lane)
        - generic [ref=e1131]: 285.3 → 267.2
        - generic [ref=e1132]: live Δ -18.1 (-6%) · whole-faucet sim Δ -10.3 (-4%) — the sim over-credits Rainbow Maker's offset (§02)
      - generic [ref=e1133]:
        - generic [ref=e1134]: Scored cells (both sides ratio-able)
        - generic [ref=e1135]: 276 ok / 40 ±25%+ / 121 ±50%+
        - generic [ref=e1136]: of 437 scored · 49 sign-flips (sim and live moved in opposite directions)
      - generic [ref=e1137]:
        - generic [ref=e1138]: Structurally unscorable cells
        - generic [ref=e1139]: 82 + 92
        - generic [ref=e1140]: baseline mismatches / stale baselines / unmodeled + window-placement artifacts
    - heading "The headline verdicts" [level=3] [ref=e1141]
    - list [ref=e1142]:
      - listitem [ref=e1143]: "On the whole faucet the sim called the change — but partly by luck. All sources in, the sim says coins fall -17.7/pd (-13%); live fell -20.7/pd (-15%). That 2.9/pd agreement hides two errors of ~15/pd pointing opposite ways: Rainbow Maker over-credited (sim 20.9 vs live 5.6) and Night Sky under-credited (sim 2.9 vs live 17.9). Fix either lane alone and the total gets worse before it gets better. §00 has the per-source arithmetic."
      - listitem [ref=e1144]: "The day map was off by a phase — corrected here from the data. The live Variant's own event-day spikes pin Aug 2 = cal_new day 5 (Sunday = Sunday, window days 5–13, no wrap), not day 27 with a wrap. Under the corrected phase, three \"discrepancies\" of the first read dissolved: Target Day's sign-flip became a green ×2.0-vs-×2.35, and Red/Bomb Challenge's \"killed but still scheduled\" became in-window agreement. Proof P0."
      - listitem [ref=e1145]: Core-SPT, Saga HC, Daily Gift, Target Day, River Rush — validated. SP_v2 R 0.812 vs live core lane ×0.81–0.88; the wb16 Control-saga correction lands saga at ×0.286 vs live ×0.284–0.322; Daily Gift ×0.61–0.65 vs ×0.63–0.66; Target Day ×2.0 vs ×2.35; River Rush removal exact. The reward-ladder machinery is right when the configs match what shipped.
      - listitem [ref=e1146]: Night Sky, compared directly, is in the right ballpark. With NS out of the baseline (wb16), the sim's NS lane is a live prediction of the Variant's faucet — level and segment shape land close (panel below), on a per-earner basis.
      - listitem [ref=e1147]: Kite Festival is now the one large direction miss. Windowed sim says ≈×1.0; live Kite pays ×5.3 HC / ×4.5 SPT at 100+. Whatever config shipped, it is not Ki_v2.
      - listitem [ref=e1148]: The saga UL-Lives swap and the Team Race SPT lane are unmodeled. Live saga UL ×1.70–1.78 vs sim ×1.0 — worth 21.8 min/pd of live UL time the sim never grants. Its UL total (23.6 vs live 36.1) is in the right region only because Rainbow Maker's UL ladder over-pays by 15.9 — again, right total, wrong route. Team Race SPT (14→20/pd at 100+) has no config or anchor.
      - listitem [ref=e1149]: "Two events genuinely diverge from the planned calendar. Jigsaw ran live ~Aug 7–10+ (plan: days 17–19 ≈ Aug 14–16) and Bomb's Ballet ended ~Aug 2 (plan: days 10–12) — they fit no phase. Chuck Challenge is a baseline gap: the live Control never runs it, `cal_curr` schedules it weekly."
    - heading "How an 8-day-shaped sim was compared against 9 days of live data" [level=3] [ref=e1150]
    - paragraph [ref=e1151]: "The sim natively answers a 33-day question in per-earner units; the A/B export answers a 9-day question in per-active-player-day units. Three moves make them commensurable, each cancelling a bias rather than estimating it:"
    - list [ref=e1152]:
      - listitem [ref=e1153]: Delta vs delta. Neither side's absolute level is trusted. The sim is scored on its predicted change (windowed SIM ÷ windowed MEASURED — per-earner denominators cancel exactly, because every simulated value is measured × R·D·T), against the live observed change (Variant papd ÷ Control papd — population denominators cancel up to PD ratios, printed below). Unit mismatches divide out; model error is what remains.
      - listitem [ref=e1154]: "The day map — phase corrected from the data. The working map (Aug 2 = day 27, wrapping 33→6 on the 28-day cycle) was tested against the live Variant's own daily grant spikes and refuted: the schedule that fits is Aug 2 = cal_new day 5 (window = days 5–13, no wrap), with leaderboard claim spikes landing the day after an instance ends. Under it, Sunday maps to Sunday and ten of twelve event families align day-for-day (proof P0). The sim side sums the Daily engine's per-day allocation over days 5–13 — leaderboards pay on instance END days, collections by accrual share, always-on by active rate. Conservation is gated: widened to days 1–33 the allocation reproduces the full 33-day sim to 1.2e-15."
      - listitem [ref=e1155]: "Payer blend. The sim emits PAYER/NONPAYER separately; the A/B pools them. Sim cells are blended with earner-share weights from `data_gains` (fallback: population payer rate). FREE resources only, corrected (RM-dedup) series, `A. 0` excluded (appendix semantics)."
    - group [ref=e1156]:
      - generic "PROOF P0 The live Variant schedule pins Aug 2 = cal_new day 5 (the old map, day 27 + wrap, does not fit) ✓ independently re-derived" [ref=e1157] [cursor=pointer]:
