    - heading "Uncertainty & ambiguity register" [level=3] [ref=e2778]
    - list [ref=e2779]:
      - listitem [ref=e2780]: "The Control arm runs its own rotation. The corrected phase was fitted on the Variant; the live Control's schedule matches `cal_curr` only loosely (its Jigsaw sat fully inside Aug 2–10 while the plan puts instances outside days 5–13; its Bomb Challenge ended Aug 8 vs planned day 13 ≈ Aug 10). Windowed CURRENT-side allocations inherit this — the delta-vs-delta scores lean on the 33-day structure where it bites."
      - listitem [ref=e2781]: Jigsaw & Bomb's Ballet moved vs the plan (fit no phase); their configs verify on 33-day ratios, but any window-level number for them is schedule, not economy.
      - listitem [ref=e2782]: "Core-SPT provenance (Q2). The live A/B does log core per-level SPT — the telemetry lane (`avg_spt_gain_CORE`) is exactly what the actual side uses here. What lacks core-SPT rows are (a) the resource-ledger export (event-lane only) and (b) the sim's own `data_gains` anchor inside wb16 — so the sim's measured side is the D18 synthetic (L × E). Ratios are clean; absolute core-SPT levels are model-vs-telemetry."
      - listitem [ref=e2783]: Season Pass placement. 'Season Pass (Free)' has no placement family → flat over 33 days; live grants cluster at tier claims. Crudest allocation in scope.
      - listitem [ref=e2784]: Payer blend drift. Weights are baseline earner shares; live conversion moved slightly. Second-order.
      - listitem [ref=e2785]: Per-earner bridges. The NS level check and the anchor boxes divide by any-source HC gainers — a known ~2–3× basis gap vs the sim's May earner base; ballpark comparisons only, flagged wherever used.
      - listitem [ref=e2786]: PerSource cross-check unresolved at unit level. Garry's AB_Summary (2) PerSource ACTUAL block uses a per-source-per-earner denominator from a query outside the repo — structure-level reconciliation only (40.8pp max share delta, denominator-driven, RM the extreme).
      - listitem [ref=e2787]: Segment definitions drift between the May behaviour pull (sim weights) and the Aug test population; A. 0 — the A/B's headline segment, and the one that moved most (+9.8% levels) — is structurally outside the sim.
      - listitem [ref=e2788]: "wb16 hygiene. The export's hidden `cal_parsed` is STALE (still lists Night Sky on cal_curr and old Target Day instances) — the offline pipeline bypasses it, but the LIVE workbook needs menu ▸ Precompute calendars re-run, plus the re-paste of the fixed `EcoGainsSim_v4.gs`. Pack/PBP-era sheets remain reverted (cards harness can't run on this branch; wb14 snapshot kept)."
