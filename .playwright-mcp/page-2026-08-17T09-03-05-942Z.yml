    - heading "Player behaviour moved — a floor under every per-level prediction" [level=3] [ref=e2708]
    - paragraph [ref=e2709]: "The sim holds behaviour fixed (T and every anchor use baseline attendance and play depth). The live Variant did not cooperate: the paying segments complete 1.4–3.8% fewer levels per active day — driven by a lower win rate (100+: 77.1% → 74.7%), not by less play (session minutes are flat-to-up, +2.5–3.4% in the mid segments) — while A. 0 completes +9.8% more (the redesign's target segment, and the one the sim structurally excludes). Two consequences: every per-level faucet (core HC and SPT, saga) carries a ~1–4% Variant-side headwind the sim cannot see; and the A. 0 uplift the redesign actually achieved has no sim counterpart at all. This is a clue to systematic under-shoots, but it bounds at a few percent — it cannot explain the Kite ×5 or the UL swap."
