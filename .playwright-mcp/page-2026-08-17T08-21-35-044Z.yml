    - paragraph [ref=e5]: "The v4 economy simulation (workbook 15) scored against the 2–10 Aug A/B actuals, cell by cell: what the model got right, where it is structurally blind, and the recalibration plan. Every conclusion carries a proof box with the numbers, the formula, and a recipe to re-derive it yourself."
