    - heading "Estimated vs actual — every source, every segment" [level=2] [ref=e14]
    - paragraph [ref=e15]: "Each cell: top = live change (Variant − Control, per active player-day) and bottom = the sim's estimated change on the same basis. Two separate signals: the red tint = how wrong the estimate is relative to the movement itself (a small source missed by 100% tints as deeply as a big one missed by 100%; near-negligible absolute misses stay dark), and the red ring = how much it matters (the ten biggest misses in absolute /pd terms). Letter cells could not be estimated on this basis (B baseline≠Control · ✓ kill agreed · + new both sides · ◉ NS direct panel · W/S/N window-missed/stale/unmodeled — the small number is the live change). \"*\" = estimate from the 33-day ratio because the event's footprint missed the window. Rows sorted by live impact."
    - heading "Overall change per resource — predicted, actual, and the miss" [level=3] [ref=e16]
    - paragraph [ref=e17]: "Three tables, read in order. All three cover the same 12 resources in the same unit: change in amount gained per active player-day (Variant minus Control, averaged over segments 0-9…100+). Nothing here is a percentage of a percentage — the Δ% column is simply that change expressed against the Control faucet for that resource, so −41 HC/pd out of a 138 HC/pd Control faucet reads −30%."
