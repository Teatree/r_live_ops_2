    - heading "The six headline verdicts" [level=3] [ref=e924]
    - list [ref=e925]:
      - listitem [ref=e926]: "The day map was off by a phase — corrected here from the data. The live Variant's own event-day spikes pin Aug 2 = cal_new day 5 (Sunday = Sunday, window days 5–13, no wrap), not day 27 with a wrap. Under the corrected phase, three \"discrepancies\" of the first read dissolved: Target Day's sign-flip became a green ×2.0-vs-×2.35, and Red/Bomb Challenge's \"killed but still scheduled\" became in-window agreement. Proof P0."
      - listitem [ref=e927]: Core-SPT, Saga HC, Daily Gift, Target Day, River Rush — validated. SP_v2 R 0.812 vs live core lane ×0.81–0.88; the wb16 Control-saga correction lands saga at ×0.286 vs live ×0.284–0.322; Daily Gift ×0.61–0.65 vs ×0.63–0.66; Target Day ×2.0 vs ×2.35; River Rush removal exact. The reward-ladder machinery is right when the configs match what shipped.
      - listitem [ref=e928]: Night Sky, compared directly, is in the right ballpark. With NS out of the baseline (wb16), the sim's NS lane is a live prediction of the Variant's faucet — level and segment shape land close (panel below), on a per-earner basis.
      - listitem [ref=e929]: Kite Festival is now the one large direction miss. Windowed sim says ≈×1.0; live Kite pays ×5.3 HC / ×4.5 SPT at 100+. Whatever config shipped, it is not Ki_v2.
      - listitem [ref=e930]: "The saga UL-Lives swap and the Team Race SPT lane are unmodeled. Live saga UL ×1.70–1.78 vs sim ×1.0 (the single biggest booster miss: UL Lives +36 min/pd live vs +2.8 predicted); Team Race SPT (14→20/pd at 100+) has no config or anchor."
      - listitem [ref=e931]: "Two events genuinely diverge from the planned calendar. Jigsaw ran live ~Aug 7–10+ (plan: days 17–19 ≈ Aug 14–16) and Bomb's Ballet ended ~Aug 2 (plan: days 10–12) — they fit no phase. Chuck Challenge is a baseline gap: the live Control never runs it, `cal_curr` schedules it weekly."
    - heading "How an 8-day-shaped sim was compared against 9 days of live data" [level=3] [ref=e932]
    - paragraph [ref=e933]: "The sim natively answers a 33-day question in per-earner units; the A/B export answers a 9-day question in per-active-player-day units. Three moves make them commensurable, each cancelling a bias rather than estimating it:"
    - list [ref=e934]:
      - listitem [ref=e935]: Delta vs delta. Neither side's absolute level is trusted. The sim is scored on its predicted change (windowed SIM ÷ windowed MEASURED — per-earner denominators cancel exactly, because every simulated value is measured × R·D·T), against the live observed change (Variant papd ÷ Control papd — population denominators cancel up to PD ratios, printed below). Unit mismatches divide out; model error is what remains.
      - listitem [ref=e936]: "The day map — phase corrected from the data. The working map (Aug 2 = day 27, wrapping 33→6 on the 28-day cycle) was tested against the live Variant's own daily grant spikes and refuted: the schedule that fits is Aug 2 = cal_new day 5 (window = days 5–13, no wrap), with leaderboard claim spikes landing the day after an instance ends. Under it, Sunday maps to Sunday and ten of twelve event families align day-for-day (proof P0). The sim side sums the Daily engine's per-day allocation over days 5–13 — leaderboards pay on instance END days, collections by accrual share, always-on by active rate. Conservation is gated: widened to days 1–33 the allocation reproduces the full 33-day sim to 1.2e-15."
      - listitem [ref=e937]: "Payer blend. The sim emits PAYER/NONPAYER separately; the A/B pools them. Sim cells are blended with earner-share weights from `data_gains` (fallback: population payer rate). FREE resources only, corrected (RM-dedup) series, `A. 0` excluded (appendix semantics)."
