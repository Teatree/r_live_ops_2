    - heading "Boosters — how the sim did on the item economy" [level=3] [ref=e2401]
    - paragraph [ref=e2402]: "Player-day-weighted, free amounts. \"on-scored act / pred\" compares like-for-like: the live change on exactly the cells the sim could score, against the sim's prediction there. Booster faucets are drips next to HC, but the pattern is consistent: where a config exists, the sim tracks booster direction (Jigsaw UL-Chuck ×0.90 vs ×1.04; the saga item ratios; Daily Gift contents identical per claim in both arms — the live nerf was HC-only, which the sim also got right). The two real gaps: the saga UL-Lives swap (+36 min/pd live vs +2.8 predicted — nothing else is the same order of magnitude) and Slingshot's rise (+0.25/pd live), which mostly sits in Rainbow Maker's slingshot-heavy ladder — an unscorable NEW_BOTH lane."
