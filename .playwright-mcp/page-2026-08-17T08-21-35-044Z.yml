        - 'generic "All four aggregates reproduce to 3-4 significant figures from resource_gains_by_segment_9d.csv + ab_denominators.csv using the stated conventions (item FREE = amount_gained excl. action=purchase; UnlimitedLives has unit=minutes, no currency rows; papd weights = is_total player_days per segment+arm, which match the player_days column in the gains file exactly). UL: 111.61->147.70 (+36.10) vs claimed 111.6->147.7 (+36.1); Chuck 1.9215->1.5919 (-0.330); Red 1.6571->1.5306; Slingshot 1.2681->1.5210 (+0.253). Per-segment detail is coherent with the narrative (UL lift monotone in segment depth, Red/Chuck cuts concentrated in heavy segments, Slingshot up everywhere). The ''+2.8 sim scorable prediction'' figure is sim-side and not derivable from the two named raw CSVs — out of scope here, neither confirmed nor refuted; the observed-side numbers are all correct." [ref=e2487]': ✓ independently re-derived
    - heading "Player behaviour moved — a floor under every per-level prediction" [level=3] [ref=e2488]
    - paragraph [ref=e2489]: "The sim holds behaviour fixed (T and every anchor use baseline attendance and play depth). The live Variant did not cooperate: the paying segments complete 1.4–3.8% fewer levels per active day — driven by a lower win rate (100+: 77.1% → 74.7%), not by less play (session minutes are flat-to-up, +2.5–3.4% in the mid segments) — while A. 0 completes +9.8% more (the redesign's target segment, and the one the sim structurally excludes). Two consequences: every per-level faucet (core HC and SPT, saga) carries a ~1–4% Variant-side headwind the sim cannot see; and the A. 0 uplift the redesign actually achieved has no sim counterpart at all. This is a clue to systematic under-shoots, but it bounds at a few percent — it cannot explain the Kite ×5 or the UL swap."
