    - heading "Uncertainty & ambiguity register" [level=3] [ref=e2558]
    - list [ref=e2559]:
      - listitem [ref=e2560]: "The Control arm runs its own rotation. The corrected phase was fitted on the Variant; the live Control's schedule matches `cal_curr` only loosely (its Jigsaw sat fully inside Aug 2–10 while the plan puts instances outside days 5–13; its Bomb Challenge ended Aug 8 vs planned day 13 ≈ Aug 10). Windowed CURRENT-side allocations inherit this — the delta-vs-delta scores lean on the 33-day structure where it bites."
      - listitem [ref=e2561]: Jigsaw & Bomb's Ballet moved vs the plan (fit no phase); their configs verify on 33-day ratios, but any window-level number for them is schedule, not economy.
      - listitem [ref=e2562]: "Core-SPT provenance (Q2). The live A/B does log core per-level SPT — the telemetry lane (`avg_spt_gain_CORE`) is exactly what the actual side uses here. What lacks core-SPT rows are (a) the resource-ledger export (event-lane only) and (b) the sim's own `data_gains` anchor inside wb16 — so the sim's measured side is the D18 synthetic (L × E). Ratios are clean; absolute core-SPT levels are model-vs-telemetry."
