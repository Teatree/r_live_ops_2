    - heading "The five headline verdicts" [level=3] [ref=e32]
    - list [ref=e33]:
      - listitem [ref=e34]: The Core-SPT recalibration is validated. Workbook (15)'s softened SP_v2 panel (R = 0.812) matches the live per-level token cut in every segment — prediction-to-live ratio 0.93–1.00. The sim's single biggest lane is now right.
      - listitem [ref=e35]: "The sim's baseline world is not the Control arm. `cal_curr` runs Night Sky daily and keeps Red/Bomb Challenge and `single_collection`-era sources; the live Control ran none of Night Sky and the Variant killed Red/Bomb. 43 + 50 cells are unanswerable by a sim that diffs two calendars the test didn't run."
      - listitem [ref=e36]: "Saga is directionally right, one-third deep enough. Sim ladder says HC ×0.80; live cut to ×0.29–0.32. The UL-Lives swap (live ×1.7) isn't modeled at all, and chest rewards (`RewardChestId`) are invisible to the ladder read."
      - listitem [ref=e37]: Kite Festival is the biggest sign-flip. Sim prices the v2 ladder at ×0.80 HC / ×0.64 SPT; live Kite pays ×5.3 / ×4.5 at 100+.
      - listitem [ref=e38]: "Kills and removals the sim did model, it got right. River Rush removal: predicted 0, live 0.01× — exact. Daily Gift nerf: predicted ×0.61–0.65, live ×0.63–0.66 — green across every segment."
    - heading "How an 8-day-shaped sim was compared against 9 days of live data" [level=3] [ref=e39]
    - paragraph [ref=e40]: "The sim natively answers a 33-day question in per-earner units; the A/B export answers a 9-day question in per-active-player-day units. Three moves make them commensurable, each cancelling a bias rather than estimating it:"
    - list [ref=e41]:
      - listitem [ref=e42]: Delta vs delta. Neither side's absolute level is trusted. The sim is scored on its predicted change (windowed SIM ÷ windowed MEASURED — per-earner denominators cancel exactly, because every simulated value is measured × R·D·T), against the live observed change (Variant papd ÷ Control papd — population denominators cancel up to PD ratios, printed below). Unit mismatches divide out; model error is what remains.
      - listitem [ref=e43]: "The day map (Garry's). Live day 1 (Aug 2) = cal_new day 27, then 28–33, wrapping to 6, 7 (28-day live cycle: day 34 ≡ day 6). The sim side sums the Daily engine's per-day allocation over exactly those 9 day-slots — leaderboards pay on instance END days, collections by accrual share, always-on by active rate. Conservation is gated: widened to days 1–33 the allocation reproduces the full 33-day sim to 1.2e-15."
      - listitem [ref=e44]: "Payer blend. The sim emits PAYER/NONPAYER separately; the A/B pools them. Sim cells are blended with earner-share weights from `data_gains` (fallback: population payer rate). FREE resources only, corrected (RM-dedup) series, `A. 0` excluded (appendix semantics)."
