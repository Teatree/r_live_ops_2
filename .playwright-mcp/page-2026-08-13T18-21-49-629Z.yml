      - paragraph [ref=e1237]: "Leaderboard events pay on instance END days; many end days fall outside the mapped slots [27–33, 6, 7] — Bomb Challenge and Level Race have every end day outside, Kite Festival and Team Event 4 of 5, Team Race 4 of 5 (its day-33 end is the one that lands inside). The sim's windowed allocation then reads ~0 on sources the live window paid (Team Race SPT: 14.04 → 19.83/pd at 100+ live — where a second defect stacks: `data_gains` carries near-zero Team Race SPT and no 100+ rows at all, so the measured anchor is stale independent of the window). These cells are scored on their 33-day ratio instead (dashed in the charts). Two further seams, flagged not fixed: the wrap (day 33 → 6) samples a different instance than the live calendar's, and cal day 27 is a Monday while Aug 2 is a Sunday — a 1-day weekday phase shift in the active-rate weighting."
