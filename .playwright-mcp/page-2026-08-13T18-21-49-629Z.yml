    - heading "Uncertainty & ambiguity register" [level=3] [ref=e1292]
    - list [ref=e1293]:
      - listitem [ref=e1294]: Control-side day mapping. The [27–33, 6, 7] map was defined for cal_new; applying the same slots to cal_curr assumes the old live calendar sat on the same grid phase. Leaderboard end-days near the window edge flip whole payouts in or out.
      - listitem [ref=e1295]: Wrap seam & weekday phase. Day 34≡ 6 substitutes a different instance of each event than the live one; the 1-day weekday shift moves weekend weighting for flat-allocated sources.
      - listitem [ref=e1296]: Season Pass placement. 'Season Pass (Free)' has no placement family → flat over 33 days; live grants cluster at tier claims. Crudest allocation in scope.
      - listitem [ref=e1297]: Payer blend drift. Weights are baseline earner shares; live conversion moved slightly (−0.05pp at A. 0). Second-order.
      - listitem [ref=e1298]: Core-SPT actual is telemetry, not ledger — and on the sim side wb15's data_gains has NO real Core-SPT rows, so the synthetic anchor (L × E) is live again in this vintage. The comparison of ratios is clean; absolute Core-SPT levels are model-vs-model.
      - listitem [ref=e1299]: PerSource cross-check unresolved at unit level. Garry's own PerSource ACTUAL block (AB_Summary (2)) uses a per-source-per-earner basis whose denominator (per-source distinct gainers) isn't derivable from the repo CSVs — structure-level comparison only (40.8pp max share delta, explained by the denominator, RM being the extreme case). The exact-unit reconciliation needs the query behind that sheet.
      - listitem [ref=e1300]: "Chest contents unpriced (downgraded on verification). `RewardChestId` chests sit on every saga node, but the live ledger shows saga chests paying near-zero HC (mostly boosters) — the direct-HC ladder read is the right HC comparator. The `Coin Val` totals (×0.76 cycle-wide) price chest boosters, not hidden HC. Booster-side saga ratios still carry this blind spot."
      - listitem [ref=e1301]: Segment definitions drift between the May behaviour pull (sim weights) and the Aug test population. A. 0 — the A/B's headline segment — is structurally outside the sim (appendix semantics, no behaviour telemetry).
      - listitem [ref=e1302]: wb15 is a partial branch. Its PackConfig/PBP-era sheets reverted (cards harness crashes, one PBP gate red on the rebuilt saga sheet); pack columns were excluded here anyway. The engine’s saga reader fix from this session must be re-pasted into the live Apps Script project.
